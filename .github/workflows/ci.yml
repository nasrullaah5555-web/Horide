name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # gitleaks lists a pull request's commits to scan them

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: horide
          POSTGRES_PASSWORD: horide_local_dev
          POSTGRES_DB: horide_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U horide -d horide_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://horide:horide_local_dev@localhost:5432/horide_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local emulators for the production adapters' integration tests (S3).
      # In its own virtual environment: the runner's system pyOpenSSL clashes with moto's deps.
      - run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.2.5"
          echo "MOTO_PYTHON=$RUNNER_TEMP/moto/bin/python" >> "$GITHUB_ENV"
      - run: pnpm format:check
      - run: pnpm --filter @horide/backend lint
      - run: pnpm --filter @horide/backend typecheck
      - run: pnpm --filter @horide/backend test
      - run: pnpm --filter @horide/backend build

  admin:
    name: Admin dashboard (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horide/admin lint
      - run: pnpm --filter @horide/admin typecheck
      - run: pnpm --filter @horide/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  web:
    name: Public website (lint, typecheck, static build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horide/web lint
      - run: pnpm --filter @horide/web typecheck
      - run: pnpm --filter @horide/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  design:
    name: Design constants (tokens up to date, no hardcoded values)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-tokens.mjs --check
      - run: node scripts/check-design.mjs

  security:
    name: Secrets and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (fail on high or critical)
        run: pnpm audit --prod --audit-level high
