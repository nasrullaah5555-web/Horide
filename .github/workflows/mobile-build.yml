name: Mobile build

# Proves the apps build as real Android and iOS apps (Gradle, manifests, CocoaPods, Xcode), which
# `flutter analyze` and `flutter test` don't check. These builds are UNSIGNED and are not
# releases: signing needs the owner's keys and accounts (OWNER_ACTION_REGISTER OA-04, OA-05).
#
# Android runs on every mobile change. iOS needs a macOS runner, which uses 10x the private-repo
# Actions minutes, so it only runs when started by hand (Actions → Mobile build → Run workflow).
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'packages/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: Also build iOS (macOS runner, uses more Actions minutes)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: APK size
        run: ls -la build/app/outputs/flutter-apk/

  # Release build: R8 shrinking, Dart obfuscation, the release API address. Signed with the
  # owner's upload key when the HORIDE_KEYSTORE_* secrets exist (OA-05); otherwise a debug-signed
  # compile check that cannot be uploaded to Google Play. The .aab is kept as a download on the
  # run page for 14 days.
  android-release:
    name: Android release bundle (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    env:
      HORIDE_API_URL: ${{ vars.HORIDE_API_URL || 'https://api.horide.invalid' }}
      HAS_KEY: ${{ secrets.HORIDE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Upload key from secrets
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.HORIDE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "HORIDE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build release app bundle
        env:
          HORIDE_KEYSTORE_PASSWORD: ${{ secrets.HORIDE_KEYSTORE_PASSWORD }}
          HORIDE_KEY_ALIAS: ${{ secrets.HORIDE_KEY_ALIAS }}
          HORIDE_KEY_PASSWORD: ${{ secrets.HORIDE_KEY_PASSWORD }}
          HORIDE_ALLOW_DEBUG_SIGNING: ${{ env.HAS_KEY != 'true' }}
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=HORIDE_API_URL="$HORIDE_API_URL"
          ls -la build/app/outputs/bundle/release/
      - name: Keep the bundle and symbols (signed builds only)
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: horide-${{ matrix.app }}-release
          path: |
            mobile/${{ matrix.app }}/build/app/outputs/bundle/release/*.aab
            mobile/${{ matrix.app }}/build/symbols
          retention-days: 14

  ios:
    name: iOS build, no signing (${{ matrix.app }})
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
