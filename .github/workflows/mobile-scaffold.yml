name: Mobile scaffold (manual)

# One-off helper: generates the Android and iOS project folders with `flutter create` (which
# can't run in the development workspace) and pushes them to a branch to be committed.
# `flutter create` on an existing project only adds missing files; it never overwrites lib/.
on:
  workflow_dispatch:

permissions:
  contents: write # pushes the generated files to the scaffold/platform-folders branch

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform folders
        run: |
          flutter --version
          (cd mobile/passenger && flutter create --project-name musride_passenger --org et.musride --platforms android,ios .)
          (cd mobile/driver && flutter create --project-name musride_driver --org et.musride --platforms android,ios .)
      # Pushed to a separate branch (artifact downloads aren't reachable from the dev workspace);
      # the files are then reviewed and copied onto main.
      - name: Push generated files to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b scaffold/platform-folders
          git add -f mobile/passenger/android mobile/passenger/ios mobile/passenger/.metadata \
                     mobile/driver/android mobile/driver/ios mobile/driver/.metadata
          git commit -m "chore(mobile): platform folders generated by flutter create"
          git push -f origin scaffold/platform-folders
