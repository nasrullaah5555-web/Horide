name: Mobile staging apps

# Android test apps for the free staging server (OWNER_ACTION_REGISTER OA-24), to install by hand
# on a phone. They are release builds (fast, like the real app) but signed with the public debug
# key, so they can NOT go to Google Play, and a later Play Store version will need this one
# uninstalled first. Started by hand: Actions → Mobile staging apps → Run workflow.
# The APKs stay downloadable on the run page for 14 days.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Staging API address (https only)
        type: string
        default: https://musride-staging-api.onrender.com

permissions:
  contents: read

jobs:
  apk:
    name: Staging APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    env:
      API_URL: ${{ inputs.api_url }}
    steps:
      - name: Refuse anything but an https address
        working-directory: . # runs before checkout, so the app folder doesn't exist yet
        run: |
          case "$API_URL" in
            https://*) echo "API: $API_URL" ;;
            *) echo "::error::api_url must start with https://"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK (debug-signed, staging only)
        env:
          MUSRIDE_ALLOW_DEBUG_SIGNING: 'true'
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=MUSRIDE_API_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "musride-${{ matrix.app }}-staging.apk"
          ls -la musride-*.apk
          sha256sum musride-*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: musride-${{ matrix.app }}-staging
          path: mobile/${{ matrix.app }}/musride-${{ matrix.app }}-staging.apk
          retention-days: 14
