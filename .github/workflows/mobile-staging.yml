name: Mobile staging apps

# Android test apps for the free staging server (OWNER_ACTION_REGISTER OA-24), to install by hand
# on a phone. They are release builds (fast, like the real app) but signed with the public debug
# key, so they can NOT go to Google Play, and a later Play Store version will need this one
# uninstalled first.
#
# Runs by itself after every successful "Mobile" check on main (so a new test build appears after
# every app change), or by hand: Actions → Mobile staging apps → Run workflow.
# Each build is published under GitHub Releases as a pre-release named "staging-<number>", with
# both APKs attached; the newest 10 are kept. Only people with access to this private repository
# can download them.
on:
  workflow_run:
    workflows: [Mobile]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: Staging API address (https only)
        type: string
        default: https://musride-staging-api.onrender.com
      market:
        description: City the test apps are built for (must match MARKET on the staging API)
        type: choice
        options: [KE, ET]
        default: KE

permissions:
  contents: read

concurrency:
  group: mobile-staging
  cancel-in-progress: false

jobs:
  apk:
    name: Staging APK (${{ matrix.app }})
    # After an automatic trigger, only build when the app checks passed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    env:
      API_URL: ${{ inputs.api_url || 'https://musride-staging-api.onrender.com' }}
      MARKET: ${{ inputs.market || 'KE' }}
    steps:
      - name: Refuse anything but an https address
        working-directory: . # runs before checkout, so the app folder doesn't exist yet
        run: |
          case "$API_URL" in
            https://*) echo "API: $API_URL" ;;
            *) echo "::error::api_url must start with https://"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          # The commit the Mobile checks passed on (for an automatic run), else the chosen branch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK (debug-signed, staging only)
        env:
          MUSRIDE_ALLOW_DEBUG_SIGNING: 'true'
          # Own app ID and "(test)" name, and one fixed test key so each build installs over the
          # last one (mobile/staging-signing/README.md).
          MUSRIDE_STAGING: 'true'
          MUSRIDE_STAGING_KEYSTORE: ${{ github.workspace }}/mobile/staging-signing/staging-test.keystore
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=MUSRIDE_API_URL="$API_URL" \
            --dart-define=MUSRIDE_MARKET="$MARKET"
          cp build/app/outputs/flutter-apk/app-release.apk "musride-${{ matrix.app }}-staging.apk"
          ls -la musride-*.apk
          sha256sum musride-*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: musride-${{ matrix.app }}-staging
          path: mobile/${{ matrix.app }}/musride-${{ matrix.app }}-staging.apk
          retention-days: 14

  release:
    name: Publish as a GitHub pre-release
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      API_URL: ${{ inputs.api_url || 'https://musride-staging-api.onrender.com' }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: apks
          merge-multiple: true
      - name: Create the release
        run: |
          set -euo pipefail
          tag="staging-${{ github.run_number }}"
          short="${SHA:0:7}"
          {
            echo "Test build for the staging server ($API_URL). Not for Google Play."
            echo
            echo "Install: download the APK on the phone and open it (allow installing from this source)."
            echo "Apps appear as \"Musride (test)\" and \"Musride Driver (test)\". Later test builds install"
            echo "over this one and keep your sign-in."
            echo "Built from commit $short on $(date -u '+%d %b %Y, %H:%M') UTC."
            echo
            echo "SHA-256:"
            echo '```'
            (cd apks && sha256sum *.apk)
            echo '```'
          } > notes.md
          gh release create "$tag" apks/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease \
            --title "Staging test build ${{ github.run_number }} ($short)" --notes-file notes.md
      - name: Keep only the newest 10 staging builds
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("staging-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
