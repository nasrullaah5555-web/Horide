name: Mobile

# Flutter can't be installed in the development workspace (ADR-014), so this workflow is the
# compile check for the mobile code: format, static analysis and unit/widget tests.
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'packages/horide_core/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'packages/horide_core/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/horide_core, mobile/passenger, mobile/driver]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the package doesn't exist yet
        id: exists
        working-directory: .
        run: test -f "${{ matrix.package }}/pubspec.yaml" && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.exists.outputs.yes == 'true'
        with:
          channel: stable
          cache: true
      - if: steps.exists.outputs.yes == 'true'
        run: flutter --version
      - if: steps.exists.outputs.yes == 'true'
        run: flutter pub get
      # Apply automatic fixes and formatting locally so analysis sees the same code the format
      # job will commit.
      - if: steps.exists.outputs.yes == 'true'
        run: dart fix --apply && dart format lib test
      - name: Analyze
        if: steps.exists.outputs.yes == 'true' && !cancelled()
        run: flutter analyze --fatal-infos
      - name: Test
        if: steps.exists.outputs.yes == 'true' && !cancelled()
        run: flutter test

  # The development workspace has no Dart SDK (ADR-014), so formatting is applied by CI: on a
  # push to main, unformatted code is formatted and committed back as a separate commit (pushes
  # made with GITHUB_TOKEN do not start new workflow runs, so this cannot loop). On a pull
  # request, unformatted code fails the check instead.
  format:
    name: dart format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format all Dart packages
        run: |
          for pkg in packages/horide_core mobile/passenger mobile/driver; do
            if [ -f "$pkg/pubspec.yaml" ]; then
              (cd "$pkg" && flutter pub get >/dev/null && dart fix --apply && dart format lib test)
            fi
          done
      - name: Commit formatting (push to main) or fail (pull request)
        run: |
          if git diff --quiet; then echo "Already formatted."; exit 0; fi
          git diff --stat
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::error::Dart code is not formatted. Run dart format lib test."
            exit 1
          fi
          git config user.name "horide-ci"
          git config user.email "horide-ci@users.noreply.github.com"
          git commit -am "style(mobile): dart format (automatic)"
          git push origin HEAD:${{ github.ref_name }}
