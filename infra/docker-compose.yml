# Local development database.
# Start:  docker compose -f infra/docker-compose.yml up -d
# Stop:   docker compose -f infra/docker-compose.yml down
# The password below is for local development only. Never reuse it anywhere else.
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: musride-postgres
    environment:
      POSTGRES_USER: musride
      POSTGRES_PASSWORD: musride_local_dev
      POSTGRES_DB: musride
    ports:
      - '127.0.0.1:5432:5432' # bound to localhost only
    volumes:
      - musride-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U musride -d musride']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  musride-pgdata:
