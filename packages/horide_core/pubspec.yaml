name: horide_core
description: Shared code for the Horide passenger and driver apps (API client, models, design system).
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.0.2
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    # Overpass (SIL Open Font License, see assets/fonts/OFL.txt), derived from road-sign lettering.
    - family: Overpass
      fonts:
        - asset: assets/fonts/Overpass-Variable.ttf
