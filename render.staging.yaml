# Render Blueprint for a FREE, PRIVATE test deployment of Horide (DEPLOYMENT_GUIDE §11).
# Not for real users: sign-in codes appear in the API's log instead of being sent by SMS,
# distances are estimates, uploaded files are lost when the free server restarts, and free
# servers sleep after 15 minutes without visitors (the first request then takes about a minute).
#
# Database: a free Supabase project (connection string and CA certificate entered as secrets).
services:
  - type: web
    name: horide-staging-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @horide/backend build
    # Free plans have no pre-deploy step or shell: migrate and load the test zone and prices at start.
    startCommand: >-
      node apps/backend/dist/database/migrate-cli.js latest &&
      node apps/backend/dist/database/seed-dev.js &&
      node apps/backend/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: NODE_VERSION
        value: '22'
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY_HOPS
        value: '1' # Render only, no Cloudflare in front
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: DATABASE_URL
        sync: false # Supabase "Session pooler" connection string
      - key: DATABASE_CA_CERT
        sync: false # Supabase CA certificate (contents of the downloaded .crt file)
      - key: CORS_ORIGINS
        sync: false # https://<console>.onrender.com,https://<website>.onrender.com
      - key: STAGING_BOOTSTRAP_ADMIN_EMAIL
        sync: false # your email; the first start prints a staff sign-in to the log
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: QUOTE_SIGNING_SECRET
        generateValue: true
      - key: ADMIN_TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: SMS_PROVIDER
        value: console
      - key: ROUTING_PROVIDER
        value: dev_estimate
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /tmp/horide-documents
      - key: PUSH_PROVIDER
        value: log

  - type: web
    name: horide-staging-admin
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @horide/admin build
    startCommand: pnpm --filter @horide/admin exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: HORIDE_API_URL
        sync: false # https://<api>.onrender.com — read at BUILD time: redeploy after changing

  - type: web
    name: horide-staging-web
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @horide/web build
    staticPublishPath: apps/web/out
    envVars:
      - key: NODE_VERSION
        value: '22'
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
